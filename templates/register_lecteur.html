<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Créer un compte lecteur</title>
  <link href="{{ url_for('static', filename='vendor/bootstrap/css/bootstrap.min.css') }}" rel="stylesheet">
  <style>
    body {
      background-image: url("{{ url_for('static', filename='photo/background1.png') }}");
      background-repeat: no-repeat;
      background-size: cover;
      background-position: center center;
      background-attachment: fixed;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      position: relative;
      z-index: 1;
    }

    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(to bottom right, rgba(255,255,255,0.2), rgba(0,0,0,0.2));
      z-index: -1;
    }

    .container-box {
      width: 900px;
      height: 500px;
      background: rgba(121, 131, 128, 0.47) ;
      border-radius: 10px;
      display: flex;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      overflow: hidden;
    }

    .left-panel {
      background: rgba(169, 171, 170, 0.53);
      flex: 1;
      padding: 50px 30px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      color: white;
    }

    .left-panel h2 {
      font-weight: bold;
    }

    .left-panel p {
      margin: 20px 0;
    }

    .left-panel a {
      padding: 10px 20px;
      border: 2px solid rgba(121, 131, 128, 0.47)  ;
      color:rgba(121, 131, 128, 0.47) ;
      text-decoration: none;
      border-radius: 25px;
      font-weight: 500;
      transition: 0.3s ease;
      text-align: center;
      width: fit-content;
    }

    .left-panel a:hover {
      background:rgba(121, 131, 128, 0.47) ;
      color: rgba(121, 131, 128, 0.47);
    }

    .right-panel {
      flex: 1;
      padding: 50px 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .right-panel h3 {
      color: rgba(103, 109, 107, 0.43);
      margin-bottom: 20px;
      text-align: center;
    }

    .form-control {
      border-radius: 30px;
      padding: 12px 20px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
    }

    .btn-submit {
      background: rgba(67, 72, 72, 0.88);
      color: rgba(28, 31, 30, 0.86);
      border: none;
      border-radius: 30px;
      padding: 12px;
      width: 100%;
      font-weight: bold;
      transition: 0.3s ease;
    }

    .btn-submit:hover {
      background: rgba(35, 39, 39, 0.84);
    }
  </style>
</head>
<body>

  <div class="container-box">
    <div class="left-panel">
      <h2>Content de te revoir!!</h2>
      <p>Pour rester connecté, veuillez entrer vos renseignements personnels</p>
      <a href="{{ url_for('login_lecteur') }}">Inscription</a>
    </div>

    <div class="right-panel">
      <h3>CONNECTER</h3>
      <form method="POST">
        <input type="text" name="nom" class="form-control" placeholder="Nom" required>
        <input type="email" name="email" class="form-control" placeholder="Email" required>
        <input type="password" name="password" class="form-control" placeholder="Mot de passe" required>
        <button type="submit" class="btn-submit">S'INSCRIRE</button>
      </form>
    </div>
  </div>

</body>
</html>
