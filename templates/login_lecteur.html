<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Connexion Lecteur</title>
  <link href="{{ url_for('static', filename='vendor/bootstrap/css/bootstrap.min.css') }}" rel="stylesheet">

  <style>
    body {
      background: url("{{ url_for('static', filename='photo/background1.png') }}") no-repeat center center fixed;
      background-size: cover;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      position: relative;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .transparent-card {
      background-color: rgba(27, 25, 25, 0.77);
      padding: 2rem;
      border-radius: 10px;
      box-shadow: 0 4px 4px rgba(194, 114, 39, 0.55);
      z-index: 1;
      width: 90%;
      max-width: 350px;
      animation: fadeInUp 1s ease-out;
    }

    .btn {
      font-size: 0.6rem; /* 👈 Pi piti bouton */
      padding: 0.4rem 1rem;
    }

    a {
      text-decoration: none !important;
      color: #f0e68c;
    }

    .alert {
      font-size: 0.95rem;
    }

    label {
      color: white;
    }

    h2 {
      color:  #f0e68c;
    }

    .inscription-msg {
      font-size: 0.9rem;
      margin-top: 1rem;
      color: #f0e68c;
    }

    .inscription-msg a {
      font-weight: bold;
      color: #ffc107; /* Koulè amber pou lyen */
    }

  </style>
</head>
<body>
  <div class="transparent-card">
    <h2 class="text-center mb-4">Connexion Lecteur</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} text-center">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST">
      <div class="mb-3">
        <label for="email">Adresse email</label>
        <input type="email" name="email" class="form-control" required>
      </div><br>
    
      <div class="mb-3">
        <label for="password">Mot de passe</label>
        <input type="password" name="mot_de_passe" class="form-control" required>
      </div>
    
      <div class="d-grid">
        <button type="submit" class="btn btn-outline-light">Se connecter</button>
      </div>
    </form>
    

    <!-- 📨 Message d'inscription -->
    <div class="text-center inscription-msg">
      Vous n'avez pas de compte ?
      <a href="{{ url_for('register_lecteur') }}">Inscrivez-vous</a>
    </div>
  </div>
</body>
</html>
